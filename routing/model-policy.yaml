{
  "$schema": "../schemas/model-routing-policy.schema.json",
  "domain": "job-search",
  "defaults": {
    "model": "gpt-5.4-mini",
    "reasoning_effort": "medium",
    "allow_tools": false,
    "fallback_model": "gpt-5.4",
    "escalate_when": ["high-risk", "ambiguous-after-two-attempts"]
  },
  "overrides_file": "config/model-policy.overrides.yaml",
  "workload_rules": [
    {
      "id": "script-only-maintenance",
      "match": {
        "task_kind": ["sync", "event-replay", "schedule-sweep", "context-build", "runtime-audit"]
      },
      "route": { "mode": "script-only" }
    },
    {
      "id": "scout-daily",
      "match": {
        "role": ["scout"],
        "task_kind": ["search", "match-scoring", "deduplication"]
      },
      "route": {
        "model": "gpt-5.4-mini",
        "reasoning_effort": "low",
        "allow_tools": true,
        "fallback_model": "gpt-5.4",
        "escalate_when": ["zero-results-streak", "schema-violation"]
      }
    },
    {
      "id": "strategist-consolidation",
      "match": {
        "role": ["strategist"],
        "task_kind": ["proposal", "consolidation", "hypothesis-evaluation"]
      },
      "route": {
        "model": "gpt-5.4",
        "reasoning_effort": "high",
        "allow_tools": false,
        "fallback_model": "gpt-5.4-mini",
        "escalate_when": ["hard-reversibility", "constraints-change", "salary-floor-change"]
      }
    },
    {
      "id": "tailor-application",
      "match": {
        "role": ["tailor"],
        "task_kind": ["resume-variant", "cover-letter", "screening-answers"]
      },
      "route": {
        "model": "gpt-5.4-mini",
        "reasoning_effort": "medium",
        "allow_tools": false,
        "fallback_model": "gpt-5.4",
        "escalate_when": ["jd-mismatch-gap", "factual-uncertainty"]
      }
    },
    {
      "id": "reviewer-gate",
      "match": {
        "role": ["reviewer"],
        "task_kind": ["package-review", "hallucination-check", "tone-check"]
      },
      "route": {
        "model": "gpt-5.4",
        "reasoning_effort": "medium",
        "allow_tools": false,
        "fallback_model": "gpt-5.4-mini",
        "escalate_when": ["ethical-ambiguity", "fabricated-credentials-suspected"]
      }
    },
    {
      "id": "applier-submit",
      "match": {
        "role": ["applier"],
        "task_kind": ["manual-outbox", "hh-apply", "site-apply", "linkedin-apply", "browser-automation"]
      },
      "route": {
        "model": "gpt-5.3-codex",
        "reasoning_effort": "high",
        "allow_tools": true,
        "fallback_model": "gpt-5.4",
        "escalate_when": ["captcha-encountered", "2fa-required", "anti-bot-detected"]
      }
    },
    {
      "id": "interviewer-mock",
      "match": {
        "role": ["interviewer"],
        "task_kind": ["mock-technical", "mock-behavioral", "mock-system-design"]
      },
      "route": {
        "model": "gpt-5.4-mini",
        "reasoning_effort": "medium",
        "allow_tools": false,
        "fallback_model": "gpt-5.4",
        "escalate_when": ["adaptive-interview", "high-stakes-calibration"]
      }
    },
    {
      "id": "interviewer-live-coding",
      "match": {
        "role": ["interviewer"],
        "task_kind": ["live-coding"]
      },
      "route": {
        "model": "gpt-5.3-codex",
        "reasoning_effort": "high",
        "allow_tools": true,
        "fallback_model": "gpt-5.4",
        "escalate_when": []
      }
    },
    {
      "id": "memory-manager-classification",
      "match": {
        "role": ["memory-manager"],
        "task_kind": ["email-classification", "event-extraction", "tagging"]
      },
      "route": {
        "model": "gpt-5.4-nano",
        "reasoning_effort": "low",
        "allow_tools": false,
        "fallback_model": "gpt-5.4-mini",
        "escalate_when": ["low-classification-confidence", "ambiguous-owner"]
      }
    },
    {
      "id": "memory-manager-journal",
      "match": {
        "role": ["memory-manager"],
        "task_kind": ["journal-summary", "session-narrative"]
      },
      "route": {
        "model": "gpt-5.4-mini",
        "reasoning_effort": "medium",
        "allow_tools": false,
        "fallback_model": "gpt-5.4",
        "escalate_when": ["cross-session-ambiguity"]
      }
    },
    {
      "id": "analyst-adhoc",
      "match": {
        "role": ["analyst"],
        "task_kind": ["funnel-query", "performance-slice", "hypothesis-check"]
      },
      "route": {
        "model": "gpt-5.4",
        "reasoning_effort": "medium",
        "allow_tools": true,
        "fallback_model": "gpt-5.4-mini",
        "escalate_when": ["small-sample", "cross-metric-ambiguity"]
      }
    },
    {
      "id": "negotiator-offer",
      "match": {
        "role": ["negotiator"],
        "task_kind": ["offer-decomposition", "counter-draft", "market-benchmark"]
      },
      "route": {
        "model": "gpt-5.4",
        "reasoning_effort": "high",
        "allow_tools": false,
        "fallback_model": "gpt-5.4-mini",
        "escalate_when": ["accept-decline-counter-decision"]
      }
    },
    {
      "id": "support-adhoc",
      "match": {
        "role": ["support"],
        "task_kind": ["lookup", "next-actions", "reminder"]
      },
      "route": {
        "model": "gpt-5.4-mini",
        "reasoning_effort": "low",
        "allow_tools": true,
        "fallback_model": "gpt-5.4",
        "escalate_when": []
      }
    },
    {
      "id": "maintainer-dependencies",
      "match": {
        "role": ["maintainer"],
        "task_kind": ["dependency-review", "audit", "outdated-scan"]
      },
      "route": {
        "model": "gpt-5.4-mini",
        "reasoning_effort": "low",
        "allow_tools": true,
        "fallback_model": "gpt-5.4",
        "escalate_when": ["major-version-bump", "security-advisory"]
      }
    }
  ]
}
