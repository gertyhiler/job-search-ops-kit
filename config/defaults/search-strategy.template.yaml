# Search strategy for the deterministic search pipeline.
# Edit freely; the search-queue reads this on every poll.
version: 1

# HH text queries. Each is searched independently.
queries:
  - "frontend developer"
  - "react developer"
  - "typescript developer"
  - "senior frontend"
  - "frontend engineer"
  - "react typescript"
  - "fullstack frontend"

# HH area ids. 113 = Russia, 1 = Moscow, 2 = Saint Petersburg.
areas:
  - 113

# Remote / schedule preferences (HH "schedule" ids: remote, flexible, fullDay).
schedule:
  - remote
  - flexible

# Only keep vacancies at or above this monthly gross floor (in RUB). null = no floor.
salaryFloor: null

# Max vacancies pulled per query per poll.
perQueryLimit: 50

# Drop vacancies whose title/description matches any of these (case-insensitive).
excludeKeywords:
  - "стажер"
  - "intern"
  - "1c"
  - "битрикс"

# Experience filter (HH ids): noExperience, between1And3, between3And6, moreThan6. null = any.
experience: null
