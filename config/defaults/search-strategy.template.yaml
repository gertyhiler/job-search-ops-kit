# Wide mechanical search funnel. Tune queries/areas in /init or via write_strategy.
version: 1

queries:
  - "frontend"
  - "frontend developer"
  - "react developer"
  - "next.js"
  - "typescript"
  - "nodejs developer"
  - "node.js"
  - "fullstack"
  - "fullstack developer"
  - "tech lead"
  - "team lead"
  - "CTO"
  - "co-founder"
  - "AI engineer"
  - "e-commerce"

# HH area ids: 113 Russia, 40 Kazakhstan, 16 Belarus, 1 Moscow, 2 SPb.
areas:
  - 113
  - 40
  - 16

# Empty = no HH schedule filter (widest funnel). Narrow in vacancy-scoring.yaml filters.
schedule: []

experience: null

perQueryLimit: 100

# Title-only ban at search time. Full text bans live in vacancy-scoring.yaml filters.
excludeKeywords:
  - "стажер"
  - "intern"
  - "junior"
